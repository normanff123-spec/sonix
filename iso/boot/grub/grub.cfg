set timeout=3
set default=0

# Force text mode - fixes "no suitable video mode found" in VirtualBox
terminal_input console
terminal_output console
set gfxpayload=text

insmod all_video
insmod multiboot
insmod gzio

menuentry "Sonix OS v1.4 - Live Boot" {
  multiboot /boot/myos.bin
  boot
}

menuentry "Sonix OS - Install to Disk" {
  multiboot /boot/myos.bin
  boot
}
